@if (open) {
<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-panel" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <div class="modal-header">
      <h3>{{ title }}</h3>
      <button type="button" class="icon-close" (click)="onClose()">✕</button>
    </div>

    <div class="modal-body">
      <ng-content></ng-content>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-cancel" (click)="onClose()">{{ cancelText }}</button>
      <button type="button" class="btn btn-confirm" (click)="onConfirm()">{{ confirmText }}</button>
    </div>
  </div>
</div>
}
