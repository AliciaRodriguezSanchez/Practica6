<div class="user-container">

  <form class="user-card" [formGroup]="form" (ngSubmit)="saveUser()">

    <!-- Imagen -->
    <div class="user-image">
      @if (id()) {
        <div class="image-edit-box">
          <img
            class="image-preview"
            [src]="form.controls.image.value || 'assets/user.png'"
            [alt]="form.controls.first_name.value || 'Usuario'"
          />
          <button type="button" class="image-edit-corner" aria-label="Editar imagen">✎</button>
        </div>
      } @else {
        <button type="button" class="image-upload-btn" aria-label="Adjuntar imagen de usuario">
          <span class="image-pencil">✎</span>
          <span class="image-upload-text">Adjuntar imagen</span>
        </button>
      }
    </div>

    <!-- Información editable -->
    <div class="user-info">

      <h2>{{ id() ? 'Editar usuario' : 'Nuevo usuario' }}</h2>

      <div class="info-row">
        <label class="label" for="firstName">Nombre:</label>
        <input id="firstName" formControlName="first_name" required>
      </div>

      <div class="info-row">
        <label class="label" for="lastName">Apellido:</label>
        <input id="lastName" formControlName="last_name" required>
      </div>

      <div class="info-row">
        <label class="label" for="email">Email:</label>
        <input id="email" type="email" formControlName="email" required>
      </div>

      <div class="info-row">
        <label class="label" for="username">Username:</label>
        <input id="username" formControlName="username" required>
      </div>

      <div class="info-row">
        <label class="label" for="password">Password:</label>
        <input id="password" type="password" formControlName="password" required>
      </div>

      <!-- Botones -->
      <div class="user-actions">
        <button type="submit" class="btn edit">{{ id() ? 'Actualizar' : 'Dar alta' }}</button>
        @if (id()) {
          <button type="button" class="btn delete" (click)="deleteUser()">Eliminar</button>
        }
        <button type="button" class="btn back" routerLink="/home">Volver</button>
      </div>

    </div>

  </form>

</div>
