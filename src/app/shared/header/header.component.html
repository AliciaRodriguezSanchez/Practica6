<header class="app-header">
  <div class="header-container">

    <!-- Logo / Título -->
    <div class="logo">
      <a routerLink="/"><img class="logo-img" alt="logo" src="assets/user.png"/></a>
      <h1>Listado de usuarios</h1>
    </div>

    <!-- Botón hamburguesa (solo móvil) -->
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      [class.hidden]="menuOpen"
    >
      ☰
    </button>
    <button class="menu-close" type="button" (click)="closeMenu()" [class.open]="menuOpen">✕</button>

    <!-- Navegación -->
    <nav class="nav-links" [class.open]="menuOpen">
      <a routerLink="/newuser" routerLinkActive="active" (click)="closeMenu()">
        <span>Nuevo Usuario</span>
        <span class="item-arrow" aria-hidden="true">></span>
      </a>
      <a routerLink="/home" routerLinkActive="active" (click)="closeMenu()">
        <span>Home</span>
        <span class="item-arrow" aria-hidden="true">></span>
      </a>
    </nav>

  </div>
</header>
